[project]
name = "omnizart"
version = "0.5.0"
description = "Omniscient Mozart, being able to transcribe everything in the music."
readme = "README.md"
authors = [
    {name = "BreezeWhite", email = "miyashita2010@tuta.io"},
    {name = "yjlolo", email = "yjlolo125@gmail.com"},
]
requires-python = ">=3.11,<3.13"
keywords = ["automatic music transcription", "drum transcription", "vocal transcription", "beat tracking"]
classifiers = [
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Version Control :: Git",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "click>=8.3.3",
    "jsonschema>=4.26.0",
    "librosa>=0.9.0",
    "numba>=0.55.0",
    "mir_eval>=0.6",
    "pillow>=12.2.0",
    "pretty_midi>=0.2.9",
    "pyfluidsynth>=1.2.5",
    "pyyaml>=6.0.3",
    "tensorflow",
    "tqdm>=4.49.0",
    "urllib3>=2.6.3",
    "setuptools<72",
]

[project.urls]
Repository = "https://github.com/Music-and-Culture-Technology-Lab/omnizart"
Documentation = "https://music-and-culture-technology-lab.github.io/omnizart-doc/"
Homepage = "https://sites.google.com/view/mctl/home"

[project.scripts]
omnizart = "omnizart.cli.cli:entry"

[project.optional-dependencies]
dev = [
    "pytest>=5.2",
    "flake8>=3.8.3",
    "pylint>=2.5.3",
    "black>=19.10b0",
    "numpydoc>=1.1.0",
    "yapf>=0.30.0",
    "sphinx-press-theme>=0.5.1",
    "pytest-cov>=2.10.1",
    "pytest-mock>=3.3.1",
    "sphinx-click>=2.5.0",
    "sphinxcontrib-bibtex>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["omnizart*"]

[tool.black]
line-length = 120
target-version = ['py36']

[build-system]
requires = ["setuptools<72", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
constraint-dependencies = [
    "setuptools<72",
]
override-dependencies = [
    "tensorflow>=2.13",
    "tensorflow-io-gcs-filesystem; sys_platform != 'win32'",
]
